<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Blood Donor Matching System</title>

   <link rel="stylesheet" href="../src/assets/css/common.css">
    <link rel="stylesheet" href="../src/assets/css/auth.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">
                <div class="blood-icon">🩸</div>

                <h1>Welcome Back</h1>

                <p>
                    Login to your blood donor matching account
                </p>
            </div>

            <form id="loginForm" novalidate>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>
                <br>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div style="display:flex; gap:8px; align-items:center;">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            style="flex:1;"
                        >
                        <button type="button" id="togglePassword" class="secondary-button" style="min-width:120px;">Show</button>
                    </div>

                </div>
<br>
                <button
                    type="submit"
                    class="primary-button"
                    id="loginButton"
                >
                    Login
                </button>

                <p id="loginMessage" class="form-message" role="alert" aria-live="polite"></p>

                <div class="forgot-password">
                    <a href="forgot-password.html">Forgot Password?</a>
                </div>
            </form>

            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create Account
                    </a>
                </p>

            </div>

        </section>

    </main>

   <script src="../src/js/auth.js"></script>

</body>
</html>

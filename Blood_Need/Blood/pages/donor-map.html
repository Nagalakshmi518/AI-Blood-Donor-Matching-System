<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Donor Radar & Tactical Map — BloodNeed</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Design System & Map CSS -->
    <link rel="stylesheet" href="../src/assets/css/design-system.css">
    <link rel="stylesheet" href="../src/assets/css/common.css">
    <link rel="stylesheet" href="../src/assets/css/donor-map.css">
</head>

<body>

    <!-- ======================================================================
         LIGHTWEIGHT AI PRELOADER
         ====================================================================== -->
    <div id="bn-preloader" class="bn-preloader">
        <div class="bn-preloader-content">
            <div class="bn-blood-pulse">
                <div class="bn-pulse-ring"></div>
                <div class="bn-pulse-ring-outer"></div>
                <div class="bn-drop-core">
                    <i class="fa-solid fa-crosshairs"></i>
                </div>
            </div>
            <div class="bn-preloader-brand">Blood<span>Need</span></div>
            <div class="bn-preloader-text">Calibrating Geospatial Radar...</div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="bn-toast-container" class="bn-toast-container"></div>

    <main class="map-page">

        <header class="map-header">
            <h1>
                <i class="fa-solid fa-map-location-dot" style="color: var(--bn-ai-cyan);"></i>
                AI Donor Dispatch Radar
            </h1>

            <button class="back-button" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </button>
        </header>

        <section id="requestInfo" class="request-info">
            <div style="padding: 20px; text-align: center; color: var(--bn-text-muted);">
                <i class="fa-solid fa-circle-notch fa-spin" style="margin-right: 8px;"></i> Loading emergency dispatch telemetry...
            </div>
        </section>

        <div id="donorMap"></div>

        <div class="legend">
            <div class="legend-item">
                <span class="legend-marker hospital-marker"></span>
                <span><i class="fa-solid fa-hospital" style="color: #EF4444; margin-right: 4px;"></i> Emergency Hospital Hub</span>
            </div>

            <div class="legend-item">
                <span class="legend-marker donor-marker"></span>
                <span><i class="fa-solid fa-user-shield" style="color: #10B981; margin-right: 4px;"></i> Top Ranked Primary Donor</span>
            </div>

            <div class="legend-item">
                <span class="legend-marker" style="background: #3B82F6; color: #3B82F6;"></span>
                <span><i class="fa-solid fa-user-check" style="color: #3B82F6; margin-right: 4px;"></i> Secondary Standby Donors</span>
            </div>
        </div>

    </main>

    <!-- App Shell & Core Utilities -->
    <script src="../src/assets/js/app-shell.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const RENDER_FALLBACK_URL = "https://ai-blood-donor-matching-system.onrender.com";

        function resolveApiUrl() {
            if (
                window.location.hostname === "localhost" ||
                window.location.hostname === "127.0.0.1"
            ) {
                if (window.location.port === "5000") {
                    return window.location.origin;
                }
                return "http://127.0.0.1:5000";
            }
            if (window.location.origin.includes("onrender.com")) {
                return window.location.origin;
            }
            return RENDER_FALLBACK_URL;
        }

        const API_URL = resolveApiUrl();
        const token = localStorage.getItem("token");
        const requestId = localStorage.getItem("selected_request_id");
        const requestInfo = document.getElementById("requestInfo");

        if (!token || !requestId) {
            window.location.href = "login.html";
        }

        async function loadMap() {
            try {
                const response = await fetch(`${API_URL}/api/patients/requests`, {
                    method: "GET",
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });

                const requests = await response.json();

                if (!response.ok) {
                    throw new Error(requests.message || "Failed to load requests");
                }

                const bloodRequest = requests.find(
                    (item) => String(item.request_id) === String(requestId)
                );

                if (!bloodRequest) {
                    throw new Error("Emergency blood request record not found");
                }

                const donors = bloodRequest.matched_donors || [];
                const validDonors = donors.filter(
                    (donor) => donor.latitude !== null && donor.longitude !== null
                );

                const emergencyBadgeColor = 
                    bloodRequest.emergency_level === "CRITICAL" ? "#EF4444" :
                    bloodRequest.emergency_level === "HIGH" ? "#F97316" :
                    bloodRequest.emergency_level === "MEDIUM" ? "#38BDF8" : "#10B981";

                requestInfo.innerHTML = `
                    <h2>
                        <i class="fa-solid fa-file-medical" style="color: var(--bn-primary);"></i>
                        Emergency Request #${bloodRequest.request_id} Overview
                    </h2>

                    <div class="request-summary">
                        <div class="summary-item">
                            <strong><i class="fa-solid fa-droplet" style="color: var(--bn-primary);"></i> Blood Group</strong>
                            <span class="bn-blood-badge" style="display: inline-block; margin-top: 4px;">${bloodRequest.blood_group}</span>
                        </div>

                        <div class="summary-item">
                            <strong><i class="fa-solid fa-hospital" style="color: #38BDF8;"></i> Hospital Facility</strong>
                            <span>${bloodRequest.hospital_name || "Emergency Center"}</span>
                        </div>

                        <div class="summary-item">
                            <strong><i class="fa-solid fa-triangle-exclamation" style="color: ${emergencyBadgeColor};"></i> Priority Level</strong>
                            <span style="color: ${emergencyBadgeColor};">${bloodRequest.emergency_level}</span>
                        </div>

                        <div class="summary-item">
                            <strong><i class="fa-solid fa-users" style="color: #10B981;"></i> Matched Responders</strong>
                            <span>${donors.length} Verified Donors</span>
                        </div>
                    </div>
                `;

                const hospitalLat = Number(bloodRequest.hospital_latitude);
                const hospitalLng = Number(bloodRequest.hospital_longitude);
                const hasHospitalLocation = Number.isFinite(hospitalLat) && Number.isFinite(hospitalLng);

                let mapCenter;
                if (hasHospitalLocation) {
                    mapCenter = [hospitalLat, hospitalLng];
                } else if (validDonors.length > 0) {
                    mapCenter = [validDonors[0].latitude, validDonors[0].longitude];
                } else {
                    mapCenter = [16.3067, 80.4365];
                }

                const map = L.map("donorMap").setView(mapCenter, 12);

                L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                    attribution: "&copy; OpenStreetMap contributors"
                }).addTo(map);

                const markerLocations = [];

                if (hasHospitalLocation) {
                    const hospitalIcon = L.icon({
                        iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",
                        shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
                        iconSize: [25, 41],
                        iconAnchor: [12, 41]
                    });

                    const hospitalMarker = L.marker([hospitalLat, hospitalLng], {
                        icon: hospitalIcon
                    }).addTo(map);

                    hospitalMarker.bindPopup(`
                        <b>🏥 Destination Hospital</b>
                        <br>
                        <strong>${bloodRequest.hospital_name}</strong>
                        <br>
                        Units Requested: ${bloodRequest.units_needed || 1}
                    `).openPopup();

                    markerLocations.push([hospitalLat, hospitalLng]);
                }

                validDonors.forEach((donor, index) => {
                    const latitude = Number(donor.latitude);
                    const longitude = Number(donor.longitude);

                    if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
                        console.warn("Skipping donor with invalid location:", donor);
                        return;
                    }

                    const isTopMatch = index === 0;
                    const donorIcon = L.icon({
                        iconUrl: isTopMatch
                            ? "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png"
                            : "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png",
                        shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
                        iconSize: [25, 41],
                        iconAnchor: [12, 41]
                    });

                    const donorMarker = L.marker([donor.latitude, donor.longitude], {
                        icon: donorIcon
                    }).addTo(map);

                    donorMarker.bindPopup(`
                        <b>🩸 Donor #${donor.donor_id} ${isTopMatch ? '<span style="color:#10B981;">(Top AI Match)</span>' : ''}</b>
                        <br><br>
                        <strong>Blood Group:</strong> ${donor.blood_group}
                        <br>
                        <strong>Distance:</strong> ${donor.distance_km != null ? Number(donor.distance_km).toFixed(2) : "N/A"} km
                        <br>
                        <strong>AI Ranking Score:</strong> ${donor.ranking_score || "N/A"}
                        <br>
                        <strong>Status:</strong> ${donor.donor_response || "Pending"}
                    `);

                    if (hasHospitalLocation) {
                        L.polyline(
                            [
                                [hospitalLat, hospitalLng],
                                [donor.latitude, donor.longitude]
                            ],
                            {
                                color: isTopMatch ? "#10B981" : "#3B82F6",
                                weight: isTopMatch ? 4 : 2,
                                opacity: 0.8,
                                dashArray: isTopMatch ? null : "6, 8"
                            }
                        ).addTo(map);
                    }

                    markerLocations.push([donor.latitude, donor.longitude]);
                });

                if (markerLocations.length > 0) {
                    const bounds = L.latLngBounds(markerLocations);
                    map.fitBounds(bounds, { padding: [50, 50] });
                }

            } catch (error) {
                requestInfo.innerHTML = `<div class="error-message"><i class="fa-solid fa-triangle-exclamation"></i> Error: ${error.message}</div>`;
                console.error(error);
            }
        }

        // Initialize tactical map
        loadMap();
    </script>

</body>

</html>

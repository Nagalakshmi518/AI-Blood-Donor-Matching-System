<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Telemetry & Analytics — BloodNeed AI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Design System & Analytics CSS -->
    <link rel="stylesheet" href="../src/assets/css/design-system.css">
    <link rel="stylesheet" href="../src/assets/css/common.css">
    <link rel="stylesheet" href="../src/assets/css/analytics.css">
</head>

<body>

    <!-- ======================================================================
         LIGHTWEIGHT AI PRELOADER
         ====================================================================== -->
    <div id="bn-preloader" class="bn-preloader">
        <div class="bn-preloader-content">
            <div class="bn-blood-pulse">
                <div class="bn-pulse-ring"></div>
                <div class="bn-pulse-ring-outer"></div>
                <div class="bn-drop-core">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
            </div>
            <div class="bn-preloader-brand">Blood<span>Need</span></div>
            <div class="bn-preloader-text">Aggregating System Telemetry...</div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="bn-toast-container" class="bn-toast-container"></div>

    <div class="analytics-page">

        <header class="analytics-header">
            <h1>
                <i class="fa-solid fa-chart-pie" style="color: var(--bn-ai-cyan);"></i>
                Blood Donation Intelligence & Analytics
            </h1>

            <div>
                <button id="backBtn" onclick="window.location.href='admin-dashboard.html'">
                    <i class="fa-solid fa-arrow-left"></i> Command Center
                </button>

                <button id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </header>

        <section id="analyticsContainer">
            <div style="padding: 40px; text-align: center; color: var(--bn-text-muted);">
                <i class="fa-solid fa-circle-notch fa-spin" style="margin-right: 8px;"></i>
                Synthesizing analytics metrics...
            </div>
        </section>

        <section id="mlResearchSection" class="ml-research-section">
            <div style="padding: 28px; text-align: center; color: var(--bn-text-muted);">
                <i class="fa-solid fa-flask" style="margin-right: 8px;"></i>
                Loading Academic Research ML Evaluation (UCI Blood Transfusion)...
            </div>
        </section>

    </div>

    <script>
        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.clear();
            window.location.href = "login.html";
        });
    </script>

    <!-- App Shell & Core Utilities -->
    <script src="../src/assets/js/app-shell.js"></script>

    <!-- Analytics JS -->
    <script src="../src/js/analytics.js"></script>

</body>

</html>

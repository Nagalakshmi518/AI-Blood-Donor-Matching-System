<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | BloodNeed</title>
    <link rel="stylesheet" href="../src/assets/css/common.css">
    <link rel="stylesheet" href="../src/assets/css/auth.css">
</head>

<body>
    <main class="auth-page">
        <section class="auth-card auth-card--compact">
            <div class="auth-header">
                <div class="blood-icon">🩸</div>
                <h1>Forgot Password</h1>
                <p>Enter your registered email to receive a password reset OTP.</p>
            </div>

            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>
<br>
                <button type="submit" class="primary-button" id="forgotButton">
                    Send OTP
                </button>

                <p id="forgotMessage" class="form-message" role="alert" aria-live="polite"></p>
                <p id="successMessage" class="success-message" role="status" aria-live="polite"></p>
            </form>

            <div class="auth-footer">
                <a href="login.html">Back to Login</a>
            </div>
        </section>
    </main>

    <script src="../src/js/forgot-password.js"></script>
</body>

</html>

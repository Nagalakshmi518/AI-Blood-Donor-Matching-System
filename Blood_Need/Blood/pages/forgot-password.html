<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | BloodNeed AI Donor Network</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS System -->
    <link rel="stylesheet" href="../src/assets/css/design-system.css">
    <link rel="stylesheet" href="../src/assets/css/auth.css">
</head>

<body>
    <!-- Lightweight Preloader -->
    <div id="bnPreloader">
        <div class="bn-preloader-content">
            <div class="bn-preloader-emblem">
                <div class="bn-preloader-ring"></div>
                <div class="bn-preloader-drop">🩸</div>
            </div>
            <div class="bn-preloader-title">Blood<span>Need</span></div>
            <div class="bn-preloader-subtitle">Account Recovery</div>
        </div>
    </div>

    <main class="auth-page">
        <section class="auth-card auth-card--compact">
            <div class="auth-header">
                <div class="blood-icon">🔐</div>
                <h1>Reset Password</h1>
                <p>Enter your registered email address to receive an authentication OTP code.</p>
            </div>

            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Registered Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="doctor@hospital.org / donor@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <button type="submit" class="primary-button" id="forgotButton">
                    <i class="fas fa-paper-plane"></i> Send Recovery Code
                </button>

                <p id="forgotMessage" class="form-message" role="alert" aria-live="polite"></p>
                <p id="successMessage" class="success-message" role="status" aria-live="polite"></p>
            </form>

            <div class="auth-footer">
                <a href="login.html"><i class="fas fa-arrow-left"></i> Return to Login</a>
            </div>
        </section>
    </main>

    <script src="../src/assets/js/app-shell.js"></script>
    <script src="../src/js/forgot-password.js"></script>
</body>

</html>

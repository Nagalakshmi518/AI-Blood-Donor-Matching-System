<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BloodNeed AI Donor Network</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS System -->
    <link rel="stylesheet" href="../src/assets/css/design-system.css">
    <link rel="stylesheet" href="../src/assets/css/auth.css">
</head>

<body>
    <!-- Lightweight Preloader -->
    <div id="bnPreloader">
        <div class="bn-preloader-content">
            <div class="bn-preloader-emblem">
                <div class="bn-preloader-ring"></div>
                <div class="bn-preloader-drop">🩸</div>
            </div>
            <div class="bn-preloader-title">Blood<span>Need</span></div>
            <div class="bn-preloader-subtitle">AI Dispatch Network</div>
        </div>
    </div>

    <main class="auth-page">
        <section class="auth-card auth-card--large">
            <div class="auth-header">
                <div class="blood-icon">🩸</div>
                <h1>Create Account</h1>
                <p>Join the AI-driven real-time emergency blood network</p>
            </div>

            <form id="registerForm" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="full_name"><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="full_name" name="full_name" placeholder="Dr. John Doe / Sarah Smith" required>
                        <div class="field-error" id="full_name_error" aria-live="polite"></div>
                    </div>

                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" id="email" name="email" placeholder="name@example.com" required>
                        <div class="field-error" id="email_error" aria-live="polite"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>
                        <div class="field-error" id="phone_error" aria-live="polite"></div>
                    </div>

                    <div class="form-group">
                        <label for="role"><i class="fas fa-id-badge"></i> Account Role</label>
                        <select id="role" name="role" required>
                            <option value="">Select your role</option>
                            <option value="PATIENT">Patient / Requester</option>
                            <option value="DONOR">Blood Donor</option>
                            <option value="HOSPITAL">Hospital / Blood Bank</option>
                        </select>
                        <div class="field-error" id="role_error" aria-live="polite"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="password" name="password" placeholder="Create strong password" required>
                        <div class="field-error" id="password_error" aria-live="polite"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password"><i class="fas fa-shield"></i> Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                        <div class="field-error" id="confirm_password_error" aria-live="polite"></div>
                    </div>
                </div>

                <!-- Donor Specific Fields -->
                <div id="donorFields" class="donor-fields" hidden>
                    <h2 class="section-title"><i class="fas fa-heart-pulse"></i> Donor Medical Profile</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" name="age" min="18" placeholder="Must be 18+">
                            <div class="field-error" id="age_error" aria-live="polite"></div>
                        </div>

                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender">
                                <option value="">Select gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                            <div class="field-error" id="gender_error" aria-live="polite"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="weight">Weight (kg)</label>
                            <input type="number" id="weight" name="weight" min="50" step="0.1" placeholder="Min 50kg for donation">
                            <div class="field-error" id="weight_error" aria-live="polite"></div>
                        </div>

                        <div class="form-group">
                            <label for="blood_group">Blood Group</label>
                            <select id="blood_group" name="blood_group">
                                <option value="">Select blood group</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                            <div class="field-error" id="blood_group_error" aria-live="polite"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="address"><i class="fas fa-location-dot"></i> Residential Address</label>
                        <input type="text" id="address" name="address" placeholder="Street name, landmark, area">
                        <div class="field-error" id="address_error" aria-live="polite"></div>
                    </div>

                    <div class="form-group">
                        <label for="availability"><i class="fas fa-toggle-on"></i> Initial Availability</label>
                        <select id="availability" name="availability">
                            <option value="true" selected>Available for Emergency Alerts</option>
                            <option value="false">Unavailable</option>
                        </select>
                    </div>

                    <div class="location-actions">
                        <button type="button" id="getLocation" class="secondary-button">
                            <i class="fas fa-crosshairs"></i> Get Current GPS Location
                        </button>
                        <button type="button" id="retryLocation" class="secondary-button secondary-button--muted">
                            <i class="fas fa-rotate"></i> Try Again
                        </button>
                    </div>

                    <p id="locationMessage" class="location-message info" aria-live="polite">
                        Location allows AI to calculate proximity to nearby patients.
                    </p>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="latitude">Latitude</label>
                            <input type="number" id="latitude" name="latitude" step="any" placeholder="Auto-detected">
                            <div class="field-error" id="latitude_error" aria-live="polite"></div>
                        </div>

                        <div class="form-group">
                            <label for="longitude">Longitude</label>
                            <input type="number" id="longitude" name="longitude" step="any" placeholder="Auto-detected">
                            <div class="field-error" id="longitude_error" aria-live="polite"></div>
                        </div>
                    </div>
                </div>

                <!-- Hospital Specific Fields -->
                <div id="hospitalFields" class="donor-fields" hidden>
                    <h2 class="section-title"><i class="fas fa-hospital"></i> Hospital Institutional Details</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="hospital_name">Hospital Name</label>
                            <input type="text" id="hospital_name" name="hospital_name" placeholder="City General Hospital">
                        </div>

                        <div class="form-group">
                            <label for="hospital_phone">Hospital Desk Phone</label>
                            <input type="tel" id="hospital_phone" name="hospital_phone" placeholder="Emergency reception phone">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="hospital_address">Hospital Physical Address</label>
                        <input type="text" id="hospital_address" name="hospital_address" placeholder="Full street address and ward">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="hospital_city">City</label>
                            <input type="text" id="hospital_city" name="hospital_city" placeholder="City">
                        </div>

                        <div class="form-group">
                            <label for="hospital_state">State</label>
                            <input type="text" id="hospital_state" name="hospital_state" placeholder="State / Province">
                        </div>
                    </div>

                    <div class="location-actions">
                        <button type="button" id="getHospitalLocation" class="secondary-button">
                            <i class="fas fa-map-pin"></i> Pin Hospital Coordinates
                        </button>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="hospital_latitude">Latitude</label>
                            <input type="number" id="hospital_latitude" name="hospital_latitude" step="any" placeholder="Latitude">
                        </div>

                        <div class="form-group">
                            <label for="hospital_longitude">Longitude</label>
                            <input type="number" id="hospital_longitude" name="hospital_longitude" step="any" placeholder="Longitude">
                        </div>
                    </div>
                </div>

                <button type="submit" class="primary-button" id="registerButton">
                    <i class="fas fa-user-plus"></i> Complete Registration
                </button>

                <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
                <p id="successMessage" class="success-message" role="alert" aria-live="polite"></p>
            </form>

            <div class="auth-footer">
                <p>
                    Already have an account?
                    <a href="login.html">Sign In</a>
                </p>
            </div>
        </section>
    </main>

    <script src="../src/assets/js/app-shell.js"></script>
    <script src="../src/js/register.js"></script>
</body>

</html>

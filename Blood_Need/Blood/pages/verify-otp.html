<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | BloodNeed</title>
    <link rel="stylesheet" href="../src/assets/css/common.css">
    <link rel="stylesheet" href="../src/assets/css/auth.css">
</head>

<body>
    <main class="auth-page">
        <section class="auth-card auth-card--compact">
            <div class="auth-header">
                <div class="blood-icon">🩸</div>
                <h1>Verify your email</h1>
                <p id="verificationIntro">Enter the 6-digit OTP sent to your email address.</p>
            </div>

            <div id="verificationState" class="verification-state" aria-live="polite">
                <p class="verification-label">We sent a verification OTP to:</p>
                <p id="emailDisplay" class="verification-email">-</p>
            </div>

            <form id="verifyOtpForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" readonly>
                </div>

                <div class="form-group">
                    <label for="otp">Verification OTP</label>
                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        class="otp-input"
                        placeholder="Enter 6-digit OTP"
                        maxlength="6"
                        required
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        aria-label="6-digit OTP"
                    >
                    <small class="helper-text">OTP is valid for a limited time.</small>
                </div>

                <div id="errorMessage" class="form-message error-message" role="alert" aria-live="polite"></div>
                <div id="successMessage" class="form-message success-message" role="status" aria-live="polite"></div>

                <button type="submit" id="verifyButton" class="primary-button">Verify Email</button>
            </form>

            <div class="auth-footer auth-footer--stacked">
                <p>If you do not have the verification email, please register again.</p>
                <div class="auth-links">
                    <a href="register.html">Back to Registration</a>
                    <span> | </span>
                    <a href="login.html">Back to Login</a>
                </div>
            </div>
        </section>
    </main>

    <script src="../src/js/verify-otp.js"></script>
</body>
</html>

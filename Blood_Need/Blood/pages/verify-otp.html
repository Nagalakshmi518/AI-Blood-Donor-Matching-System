<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | BloodNeed AI Donor Network</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS System -->
    <link rel="stylesheet" href="../src/assets/css/design-system.css">
    <link rel="stylesheet" href="../src/assets/css/auth.css">
</head>

<body>
    <!-- Lightweight Preloader -->
    <div id="bnPreloader">
        <div class="bn-preloader-content">
            <div class="bn-preloader-emblem">
                <div class="bn-preloader-ring"></div>
                <div class="bn-preloader-drop">🩸</div>
            </div>
            <div class="bn-preloader-title">Blood<span>Need</span></div>
            <div class="bn-preloader-subtitle">Security Check</div>
        </div>
    </div>

    <main class="auth-page">
        <section class="auth-card auth-card--compact">
            <div class="auth-header">
                <div class="blood-icon">🛡️</div>
                <h1>Verify Email Address</h1>
                <p id="verificationIntro">Enter the 6-digit cryptographic security code sent to your inbox.</p>
            </div>

            <div id="verificationState" class="verification-state" aria-live="polite">
                <p class="verification-label"><i class="fas fa-paper-plane"></i> OTP Dispatched To</p>
                <p id="emailDisplay" class="verification-email">-</p>
            </div>

            <form id="verifyOtpForm" novalidate>
                <div class="form-group" style="display:none;">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" readonly>
                </div>

                <div class="form-group">
                    <label for="otp"><i class="fas fa-key"></i> 6-Digit Verification Code</label>
                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        class="otp-input"
                        placeholder="••••••"
                        maxlength="6"
                        required
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        aria-label="6-digit OTP"
                    >
                    <small class="helper-text"><i class="fas fa-clock"></i> The OTP is valid for a limited time.</small>
                </div>

                <div id="errorMessage" class="form-message error-message" role="alert" aria-live="polite"></div>
                <div id="successMessage" class="form-message success-message" role="status" aria-live="polite"></div>

                <button type="submit" id="verifyButton" class="primary-button">
                    <i class="fas fa-check-double"></i> Verify & Activate Account
                </button>
            </form>

            <div class="auth-footer auth-footer--stacked">
                <p>Did not receive the verification code?</p>
                <div class="auth-links">
                    <a href="register.html"><i class="fas fa-user-plus"></i> Re-Register</a>
                    <span>&bull;</span>
                    <a href="login.html"><i class="fas fa-arrow-left"></i> Return to Login</a>
                </div>
            </div>
        </section>
    </main>

    <script src="../src/assets/js/app-shell.js"></script>
    <script src="../src/js/verify-otp.js"></script>
</body>
</html>

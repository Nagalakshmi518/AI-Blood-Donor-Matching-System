<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Alerts & Notifications — BloodNeed</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Design System & Notifications CSS -->
    <link rel="stylesheet" href="../src/assets/css/design-system.css">
    <link rel="stylesheet" href="../src/assets/css/common.css">
    <link rel="stylesheet" href="../src/assets/css/notifications.css">
</head>

<body>

    <!-- ======================================================================
         LIGHTWEIGHT AI PRELOADER
         ====================================================================== -->
    <div id="bn-preloader" class="bn-preloader">
        <div class="bn-preloader-content">
            <div class="bn-blood-pulse">
                <div class="bn-pulse-ring"></div>
                <div class="bn-pulse-ring-outer"></div>
                <div class="bn-drop-core">
                    <i class="fa-solid fa-bell"></i>
                </div>
            </div>
            <div class="bn-preloader-brand">Blood<span>Need</span></div>
            <div class="bn-preloader-text">Syncing Dispatch Alerts...</div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="bn-toast-container" class="bn-toast-container"></div>

    <div class="container">

        <div class="header">
            <div>
                <h1><i class="fa-solid fa-bell-concierge" style="color: var(--bn-primary); margin-right: 8px;"></i> Emergency Alerts & Updates</h1>
                <p>Real-Time Broadcast Dispatch & Response Timeline</p>
            </div>

            <button onclick="goBack()">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </button>
        </div>

        <div id="notificationsContainer">
            <div class="loading">
                <i class="fa-solid fa-circle-notch fa-spin" style="margin-right: 8px;"></i> Loading active notification stream...
            </div>
        </div>

    </div>

    <!-- App Shell & Core Utilities -->
    <script src="../src/assets/js/app-shell.js"></script>

    <!-- Notifications JS -->
    <script src="../src/js/notifications.js"></script>

</body>

</html>

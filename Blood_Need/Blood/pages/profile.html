<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile</title>

    <link
        rel="stylesheet"
        href="../src/assets/css/common.css"
    >

    <link
        rel="stylesheet"
        href="../src/assets/css/profile.css"
    >

</head>

<body>

    <main class="profile-page">

        <section class="profile-card">

            <h1>My Profile</h1>

            <p>
                View and update your patient details.
            </p>

            <form id="profileForm">

                <label for="blood_group">
                    Blood Group
                </label>

                <select id="blood_group" required>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>


                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    required
                >


                <label for="gender">
                    Gender
                </label>

                <select id="gender" required>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label for="hospital_name">
                    Hospital Name
                </label>

                <input
                    type="text"
                    id="hospital_name"
                    required
                >

                <button
                    type="button"
                    id="updateLocationButton"
                >
                    Update Current Location
                </button>

                <p id="locationMessage"></p>

                <label for="latitude">
                    Latitude
                </label>

                <input
                    type="number"
                    id="latitude"
                    step="any"
                >

                <label for="longitude">
                    Longitude
                </label>

                <input
                    type="number"
                    id="longitude"
                    step="any"
                >

                <button
                    type="submit"
                >
                    Update Profile
                </button>

                <p id="profileMessage"></p>

            </form>

           <button class="back-dashboard-btn" onclick="goBackToDashboard()">
    ← Back to Dashboard
</button>

        </section>

    </main>

    <script src="../src/js/profile.js"></script>

</body>

</html>

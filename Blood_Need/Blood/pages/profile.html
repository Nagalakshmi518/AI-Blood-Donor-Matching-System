<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Medical Profile — BloodNeed</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Design System & Profile CSS -->
    <link rel="stylesheet" href="../src/assets/css/design-system.css">
    <link rel="stylesheet" href="../src/assets/css/common.css">
    <link rel="stylesheet" href="../src/assets/css/profile.css">
</head>

<body>

    <!-- ======================================================================
         LIGHTWEIGHT AI PRELOADER
         ====================================================================== -->
    <div id="bn-preloader" class="bn-preloader">
        <div class="bn-preloader-content">
            <div class="bn-blood-pulse">
                <div class="bn-pulse-ring"></div>
                <div class="bn-pulse-ring-outer"></div>
                <div class="bn-drop-core">
                    <i class="fa-solid fa-user-gear"></i>
                </div>
            </div>
            <div class="bn-preloader-brand">Blood<span>Need</span></div>
            <div class="bn-preloader-text">Loading Medical Identity...</div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="bn-toast-container" class="bn-toast-container"></div>

    <main class="profile-page">

        <section class="profile-card">

            <h1><i class="fa-solid fa-id-badge" style="color: var(--bn-primary); margin-right: 8px;"></i> My Patient Profile</h1>
            <p>Review and calibrate clinical records, emergency hospital affiliation, and GPS coordinates.</p>

            <form id="profileForm">

                <div class="form-group">
                    <label for="blood_group">Blood Group Type</label>
                    <select id="blood_group" required>
                        <option value="A+">A+ (A Positive)</option>
                        <option value="A-">A- (A Negative)</option>
                        <option value="B+">B+ (B Positive)</option>
                        <option value="B-">B- (B Negative)</option>
                        <option value="AB+">AB+ (AB Positive)</option>
                        <option value="AB-">AB- (AB Negative)</option>
                        <option value="O+">O+ (O Positive)</option>
                        <option value="O-">O- (O Negative)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="age">Age (Years)</label>
                    <input type="number" id="age" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="hospital_name">Affiliated Hospital Facility</label>
                    <input type="text" id="hospital_name" required>
                </div>

                <div class="form-group full-width">
                    <button type="button" id="updateLocationButton">
                        <i class="fa-solid fa-location-crosshairs"></i> Synchronize Current GPS Location
                    </button>
                    <p id="locationMessage"></p>
                </div>

                <div class="form-group">
                    <label for="latitude">Latitude Coordinate</label>
                    <input type="number" id="latitude" step="any">
                </div>

                <div class="form-group">
                    <label for="longitude">Longitude Coordinate</label>
                    <input type="number" id="longitude" step="any">
                </div>

                <button type="submit">
                    <i class="fa-solid fa-floppy-disk" style="margin-right: 6px;"></i> Update Patient Profile
                </button>

                <p id="profileMessage" class="full-width"></p>

            </form>

            <button class="back-dashboard-btn" onclick="goBackToDashboard()">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </button>

        </section>

    </main>

    <!-- App Shell & Core Utilities -->
    <script src="../src/assets/js/app-shell.js"></script>

    <!-- Profile JS -->
    <script src="../src/js/profile.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Donor Profile</title>

    <link
        rel="stylesheet"
        href="../src/assets/css/common.css"
    >

    <link
        rel="stylesheet"
        href="../src/assets/css/profile.css"
    >

</head>

<body>

    <main class="profile-page">

        <section class="profile-card">

            <h1>My Donor Profile</h1>

            <p>
                View and update your donor details.
            </p>

            <form id="profileForm">

                <div class="form-group">
                    <label for="blood_group">
                        Blood Group
                    </label>

                    <select id="blood_group" required>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="gender">
                        Gender
                    </label>

                    <select id="gender" required>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="weight">
                        Weight (kg)
                    </label>

                    <input
                        type="number"
                        id="weight"
                        step="0.1"
                    >
                </div>

                <div class="form-group full-width">
                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                    >
                </div>

                <div class="form-group full-width">
                    <button
                        type="button"
                        id="updateLocationButton"
                        class="secondary-btn"
                    >
                        Update Current Location
                    </button>

                    <p id="locationMessage"></p>
                </div>

                <div class="form-group">
                    <label for="latitude">
                        Latitude
                    </label>

                    <input
                        type="number"
                        id="latitude"
                        step="any"
                    >
                </div>

                <div class="form-group">
                    <label for="longitude">
                        Longitude
                    </label>

                    <input
                        type="number"
                        id="longitude"
                        step="any"
                    >
                </div>

                <div class="form-actions full-width">
                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Save Changes
                    </button>
                </div>

                <p id="profileMessage" class="form-message full-width"></p>

            </form>

            <div class="back-button-wrap">
                <button
                    type="button"
                    class="dashboard-link-btn"
                    onclick="goBackToDashboard()"
                >
                    ← Back to Dashboard
                </button>
            </div>

        </section>

    </main>

    <script src="../src/js/donor-profile.js"></script>

</body>

</html>

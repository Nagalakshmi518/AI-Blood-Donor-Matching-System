<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | BloodNeed AI Donor Network</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS System -->
    <link rel="stylesheet" href="../src/assets/css/design-system.css">
    <link rel="stylesheet" href="../src/assets/css/auth.css">
</head>

<body>
    <!-- Lightweight Preloader -->
    <div id="bnPreloader">
        <div class="bn-preloader-content">
            <div class="bn-preloader-emblem">
                <div class="bn-preloader-ring"></div>
                <div class="bn-preloader-drop">🩸</div>
            </div>
            <div class="bn-preloader-title">Blood<span>Need</span></div>
            <div class="bn-preloader-subtitle">Security Protocol</div>
        </div>
    </div>

    <main class="auth-page">
        <section class="auth-card auth-card--compact">
            <div class="auth-header">
                <div class="blood-icon">🛡️</div>
                <h1>Choose New Password</h1>
                <p>Create a strong password to secure your medical portal account.</p>
            </div>

            <div id="resetEmailContainer" class="verification-state">
                <div class="verification-label"><i class="fas fa-user-shield"></i> Target Account</div>
                <div id="resetEmailDisplay" class="verification-email" aria-live="polite"></div>
            </div>

            <form id="resetForm" novalidate>
                <div class="form-group" style="display:none;">
                    <label for="resetEmail">Email</label>
                    <input type="email" id="resetEmail" name="resetEmail" readonly>
                </div>

                <div class="form-group">
                    <label for="otp"><i class="fas fa-key"></i> 6-Digit Reset Code</label>
                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        class="otp-input"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        maxlength="6"
                        autocomplete="one-time-code"
                        placeholder="••••••"
                        required
                        aria-label="6 digit OTP"
                    >
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> New Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 8 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirm"><i class="fas fa-shield"></i> Confirm New Password</label>
                    <input type="password" id="confirm" name="confirm" placeholder="Re-type your password" required>
                </div>

                <button type="submit" class="primary-button" id="resetButton">
                    <i class="fas fa-check-circle"></i> Update Password
                </button>

                <p id="resetMessage" class="form-message" role="alert" aria-live="polite"></p>
                <p id="successMessage" class="success-message" role="status" aria-live="polite"></p>
            </form>

            <div id="missingEmailActions" class="auth-footer auth-footer--stacked" hidden>
                <p class="form-message" role="alert">Reset email reference not detected. Please request a new OTP.</p>
                <a href="forgot-password.html" class="secondary-button"><i class="fas fa-rotate"></i> Request New Code</a>
            </div>

            <div class="auth-footer auth-footer--stacked">
                <a href="login.html"><i class="fas fa-arrow-left"></i> Return to Login</a>
            </div>
        </section>
    </main>

    <script src="../src/assets/js/app-shell.js"></script>
    <script src="../src/js/reset-password.js"></script>
</body>

</html>

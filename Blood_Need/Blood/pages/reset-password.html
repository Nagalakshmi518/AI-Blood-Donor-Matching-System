<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | BloodNeed</title>
    <link rel="stylesheet" href="../src/assets/css/auth.css">
</head>

<body>
    <main class="auth-page">
        <section class="auth-card auth-card--compact">
            <div class="auth-header">
                <div class="blood-icon">🩸</div>
                <h1>Reset Password</h1>
                <p>Choose a new password for your account.</p>
            </div>

            <div id="resetEmailContainer" class="verification-state">
                <div class="verification-label">Account Email</div>
                <div id="resetEmailDisplay" class="verification-email" aria-live="polite"></div>
            </div>

            <form id="resetForm" novalidate>
                <div class="form-group">
                    <label for="resetEmail">Email</label>
                    <input type="email" id="resetEmail" name="resetEmail" readonly>
                </div>
<br>
                <div class="form-group">
                    <label for="otp">OTP</label>
                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        class="otp-input"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        maxlength="6"
                        autocomplete="one-time-code"
                        required
                        aria-label="6 digit OTP"
                    >
                </div>
<br>
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
<br>
                <div class="form-group">
                    <label for="confirm">Confirm Password</label>
                    <input type="password" id="confirm" name="confirm" required>
                </div>
<br>
                <button type="submit" class="primary-button" id="resetButton">
                    Reset Password
                </button>

                <p id="resetMessage" class="form-message" role="alert" aria-live="polite"></p>
                <p id="successMessage" class="success-message" role="status" aria-live="polite"></p>
            </form>

            <div id="missingEmailActions" class="auth-footer auth-footer--stacked" hidden>
                <p class="form-message" role="alert">Reset email not found. Please request a new OTP.</p>
                <a href="forgot-password.html" class="primary-button secondary-button">Request New OTP</a>
            </div>

            <div class="auth-footer auth-footer--stacked">
                <a href="login.html">Back to Login</a>
            </div>
        </section>
    </main>

    <script src="../src/js/reset-password.js"></script>
</body>

</html>
